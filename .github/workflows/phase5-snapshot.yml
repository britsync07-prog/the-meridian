name: Phase 5 — Snapshot & Build Assertions

on:
  schedule:
    # Hourly at :10 — never :00 (avoids CI burst)
    - cron: '10 * * * *'
  workflow_dispatch:
  push:
    branches: [main, release/v1.0]
    paths:
      - 'apps/worker/**'
      - 'apps/site/**'
      - 'scripts/stories/**'
      - 'scripts/ingest/**'
      - 'scripts/media/**'
      - 'scripts/snapshot/**'
      - 'scripts/assert/**'
      - 'apps/site/src/lib/snapshot.ts'
      - 'config/**'
      - 'package.json'
      - 'package-lock.json'
      - 'shared/**/*'
      - '.github/workflows/phase5-snapshot.yml'

concurrency:
  group: meridian-publication
  cancel-in-progress: false

jobs:
  snapshot-and-build:
    name: Generate Snapshot & Run Assertions
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
      CF_KV_NAMESPACE_ID: c7ee93b7d9a6497787f40b1d441469ae
      R2_BUCKET_NAME: meridian
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Verify static production performance budget
        run: npm run test:lighthouse

      - name: Ingest, curate, and publish current feeds
        run: npm run ingest:publish
        continue-on-error: true

      - name: Generate snapshot from D1 → R2
        run: node scripts/snapshot/generate-snapshot.mjs
        env:
          INCLUDE_PENDING_IMAGES: '1'
        # Requires CF_API_TOKEN, CF_ACCOUNT_ID, CF_D1_DATABASE_ID, R2_BUCKET_NAME

      - name: Generate and verify responsive publisher-image variants
        run: npm run media:generate
        env:
          MEDIA_OUTPUT_DIR: apps/site/.media-staging

      - name: Regenerate publication snapshot with verified images only
        run: node scripts/snapshot/generate-snapshot.mjs

      - name: Build site
        run: npm run build

      - name: Materialize verified image variants for upload
        run: npm run media:generate
        env:
          MEDIA_OUTPUT_DIR: apps/site/dist/media

      - name: Generate Open Graph story images
        run: npm run og:generate

      - name: Run build assertions (OPS-09 through OPS-13)
        run: npm run assert:build

      - name: Run tests
        run: npm test -- --run

      - name: Upload story tier to R2
        run: node scripts/stories/upload-to-r2.mjs

      - name: Deploy Worker and static assets
        run: npx wrangler deploy --config apps/worker/wrangler.jsonc
